<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bluetooth Terminal & Control</title>
<style>
  :root {
    --bg-color: #0d0f12;
    --card-bg: #161b22;
    --border-color: #30363d;
    --text-color: #c9d1d9;
    --heading-color: #f0f6fc;
    --accent-color: #238636;
    --accent-hover: #2ea043;
    --warn-color: #da3633;
    --subtext: #8b949e;
  }
  [data-theme="light"] {
    --bg-color: #f6f8fa;
    --card-bg: #ffffff;
    --border-color: #d0d7de;
    --text-color: #1f2328;
    --heading-color: #0f1419;
    --accent-color: #1f883d;
    --accent-hover: #1a7f37;
    --warn-color: #cf222e;
    --subtext: #57606a;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    background-color: var(--bg-color);
    color: var(--text-color);
    margin: 0;
    padding: 16px;
  }
  .wrap { max-width: 700px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  h1 { font-size: 1.2rem; margin: 0; color: var(--heading-color); }
  .status {
    font-size: 0.8rem; padding: 4px 10px; border-radius: 20px;
    background: #333; color: #fff; font-weight: bold;
  }
  .status[data-state="connected"] { background: #238636; }
  .status[data-state="connecting"] { background: #d29922; }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 14px;
  }
  .section-title {
    font-size: 0.85rem;
    font-weight: bold;
    margin-bottom: 8px;
    color: var(--heading-color);
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 4px;
  }
  .row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 8px; }
  .grid-6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 8px; }

  input[type="text"] {
    flex: 1; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color);
    background: var(--bg-color); color: #39ff14; font-family: monospace; font-size: 0.9rem; outline: none;
  }
  button {
    padding: 10px 8px; border-radius: 6px; border: none; font-weight: bold;
    cursor: pointer; background: var(--accent-color); color: white; transition: background 0.2s;
    font-size: 0.85rem; text-align: center;
  }
  button:hover:not(:disabled) { background: var(--accent-hover); }
  button.primary { background: #1f6feb; }
  button.primary:hover:not(:disabled) { background: #388bfd; }
  button.secondary { background: #8957e5; }
  button.secondary:hover:not(:disabled) { background: #a371f7; }
  button.dark-btn { background: #30363d; color: var(--text-color); }
  button.dark-btn:hover:not(:disabled) { background: #484f58; }
  button.danger { background: var(--warn-color); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  
  pre#console {
    background: #000; color: #39ff14; padding: 12px; border-radius: 6px;
    font-size: 0.8rem; height: 280px; overflow-y: auto; white-space: pre-wrap;
    font-family: monospace; border: 1px solid var(--border-color); margin: 0;
  }
  .rx-text { color: #00ffff; }
  .tx-text { color: #ff00ff; }
  .sys-text { color: #8b949e; }
  .err-text { color: #ff4d4d; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>BLE Terminal & Control</h1>
    <span class="status" id="status" data-state="disconnected">Getrennt</span>
  </header>

  <!-- VERBINDUNG -->
  <div class="card">
    <div class="row" style="margin-bottom:0;">
      <button id="btn-conn" style="width: 100%;">Gerät suchen & verbinden</button>
    </div>
    <div class="row" style="margin-top: 6px; margin-bottom:0;">
      <span class="sys-text" id="dev-info">Kein Gerät ausgewählt</span>
    </div>
  </div>

  <!-- STEUERUNG -->
  <div class="card">
    <!-- Schloss -->
    <div class="section-title">Sperre / Entsperre</div>
    <div class="grid-2">
      <button id="btn-unlock" class="primary" disabled>🔓 Unlock</button>
      <button id="btn-lock" class="danger" disabled>🔒 Lock</button>
    </div>

    <!-- KERS -->
    <div class="section-title" style="margin-top: 10px;">KERS (Rekuperation)</div>
    <div class="grid-4">
      <button id="btn-kers-off" class="dark-btn" disabled>Aus</button>
      <button id="btn-kers-low" class="secondary" disabled>Low</button>
      <button id="btn-kers-mid" class="secondary" disabled>Mid</button>
      <button id="btn-kers-high" class="secondary" disabled>High</button>
    </div>

    <!-- TCS & Eco Turbo -->
    <div class="section-title" style="margin-top: 10px;">Traktionskontrolle & Modi</div>
    <div class="grid-2">
      <button id="btn-tcs-on" class="primary" disabled>TCS An</button>
      <button id="btn-tcs-off" class="dark-btn" disabled>TCS Aus</button>
    </div>
    <div class="grid-2">
      <button id="btn-turbo-on" class="secondary" disabled>Eco Turbo An</button>
      <button id="btn-turbo-off" class="dark-btn" disabled>Eco Turbo Aus</button>
    </div>

    <!-- Startgeschwindigkeit -->
    <div class="section-title" style="margin-top: 10px;">Startgeschwindigkeit (Kickstart)</div>
    <div class="grid-6">
      <button id="btn-speed-0" class="primary" disabled>0 km/h</button>
      <button id="btn-speed-1" class="dark-btn" disabled>1</button>
      <button id="btn-speed-2" class="dark-btn" disabled>2</button>
      <button id="btn-speed-3" class="dark-btn" disabled>3</button>
      <button id="btn-speed-4" class="dark-btn" disabled>4</button>
      <button id="btn-speed-5" class="dark-btn" disabled>5 km/h</button>
    </div>

    <!-- Licht & Töne -->
    <div class="section-title" style="margin-top: 10px;">Licht & Sound</div>
    <div class="grid-2">
      <button id="btn-light-on" class="primary" disabled>💡 Rücklicht An</button>
      <button id="btn-light-off" class="dark-btn" disabled>💡 Rücklicht Aus</button>
    </div>
    <div class="grid-2">
      <button id="btn-sound-on" class="primary" disabled>🔊 Blinker Sound An</button>
      <button id="btn-sound-off" class="dark-btn" disabled>🔇 Blinker Sound Aus</button>
    </div>
  </div>

  <!-- MANUELLES HEX SENDEN -->
  <div class="card">
    <div class="section-title">Manuelles Hex Terminal</div>
    <div class="row">
      <input type="text" id="hex-input" placeholder="Hex eingeben (z.B. 55 AA 00...)" disabled>
      <button id="btn-send" disabled>Senden</button>
    </div>
  </div>

  <!-- TERMINAL -->
  <div class="card" style="padding: 8px;">
    <div class="row" style="justify-content: space-between; padding: 0 4px 6px 4px;">
      <span style="font-size: 0.85rem; font-weight: bold;">Live Log</span>
      <button id="btn-clear" style="padding: 4px 8px; font-size: 0.75rem; background: #333;">Clear</button>
    </div>
    <pre id="console">[SYS] Bereit. Klicke auf 'Gerät suchen & verbinden'...</pre>
  </div>
</div>

<script>
let gattServer = null;
let txChar = null;
let rxChars = [];

const btnConn = document.getElementById('btn-conn');
const btnSend = document.getElementById('btn-send');
const btnClear = document.getElementById('btn-clear');
const hexInput = document.getElementById('hex-input');
const statusEl = document.getElementById('status');
const devInfo = document.getElementById('dev-info');
const consoleEl = document.getElementById('console');

// Befehlsliste
const COMMANDS = {
  unlock:      "55 AA 00 52 01 00 52 FD FE",
  lock:        "55 AA 00 52 01 01 53 FD FE",
  kersOff:     "55 AA 00 53 01 00 53 FD FE",
  kersLow:     "55 AA 00 53 01 1E 71 FD FE",
  kersMid:     "55 AA 00 53 01 3C 8F FD FE",
  kersHigh:    "55 AA 00 53 01 5A AD FD FE",
  tcsOn:       "55 AA 00 5F 01 01 60 FD FE",
  tcsOff:      "55 AA 00 5F 01 00 5F FD FE",
  speed5:      "55 AA 00 6A 01 05 6F FD FE",
  speed4:      "55 AA 00 6A 01 04 6E FD FE",
  speed3:      "55 AA 00 6A 01 03 6D FD FE",
  speed2:      "55 AA 00 6A 01 02 6C FD FE",
  speed1:      "55 AA 00 6A 01 01 6B FD FE",
  speed0:      "55 AA 00 6A 01 00 6A FD FE",
  turboOn:     "55 AA 00 58 01 05 5D FD FE",
  turboOff:    "55 AA 00 58 01 03 5B FD FE",
  lightOn:     "55 AA 00 54 01 01 55 FD FE",
  lightOff:    "55 AA 00 54 01 00 54 FD FE",
  soundOn:     "55 AA 00 60 01 01 61 FD FE",
  soundOff:    "55 AA 00 60 01 00 60 FD FE"
};

const actionButtons = [
  { id: 'btn-unlock', hex: COMMANDS.unlock },
  { id: 'btn-lock', hex: COMMANDS.lock },
  { id: 'btn-kers-off', hex: COMMANDS.kersOff },
  { id: 'btn-kers-low', hex: COMMANDS.kersLow },
  { id: 'btn-kers-mid', hex: COMMANDS.kersMid },
  { id: 'btn-kers-high', hex: COMMANDS.kersHigh },
  { id: 'btn-tcs-on', hex: COMMANDS.tcsOn },
  { id: 'btn-tcs-off', hex: COMMANDS.tcsOff },
  { id: 'btn-speed-0', hex: COMMANDS.speed0 },
  { id: 'btn-speed-1', hex: COMMANDS.speed1 },
  { id: 'btn-speed-2', hex: COMMANDS.speed2 },
  { id: 'btn-speed-3', hex: COMMANDS.speed3 },
  { id: 'btn-speed-4', hex: COMMANDS.speed4 },
  { id: 'btn-speed-5', hex: COMMANDS.speed5 },
  { id: 'btn-turbo-on', hex: COMMANDS.turboOn },
  { id: 'btn-turbo-off', hex: COMMANDS.turboOff },
  { id: 'btn-light-on', hex: COMMANDS.lightOn },
  { id: 'btn-light-off', hex: COMMANDS.lightOff },
  { id: 'btn-sound-on', hex: COMMANDS.soundOn },
  { id: 'btn-sound-off', hex: COMMANDS.soundOff }
];

actionButtons.forEach(b => {
  const el = document.getElementById(b.id);
  if (el) el.onclick = () => sendHex(b.hex);
});

function log(msg, type = 'sys') {
  const time = new Date().toLocaleTimeString();
  const span = document.createElement('span');
  span.className = `${type}-text`;
  span.textContent = `\n[${time}] ${msg}`;
  consoleEl.appendChild(span);
  consoleEl.scrollTop = consoleEl.scrollHeight;
}

btnClear.onclick = () => { consoleEl.textContent = '[SYS] Log geleert.'; };

btnConn.onclick = async () => {
  if (gattServer && gattServer.connected) {
    gattServer.disconnect();
    disconnectUI();
    return;
  }

  if (!navigator.bluetooth) {
    alert("Web Bluetooth wird nicht unterstützt. Bitte benutze Bluefy (iOS) oder Chrome (Android/PC)!");
    return;
  }

  try {
    log("Scanne nach Bluetooth LE Geräten...", "sys");
    statusEl.textContent = "Suche...";
    statusEl.setAttribute('data-state', 'connecting');

    const device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: [
        '0000fe01-0000-1000-8000-00805f9b34fb',
        '0000e0ff-0000-1000-8000-00805f9b34fb',
        '00001800-0000-1000-8000-00805f9b34fb',
        '0000180a-0000-1000-8000-00805f9b34fb'
      ]
    });

    devInfo.textContent = `Gerät: ${device.name || 'Unbenannt'} (${device.id})`;
    log(`Verbinde mit: ${device.name || 'Unbenannt'}...`, "sys");

    gattServer = await device.gatt.connect();
    log("GATT Server verbunden! Rufe Services ab...", "sys");

    const services = await gattServer.getPrimaryServices();
    log(`Anzahl gefundener Services: ${services.length}`, "sys");

    txChar = null;
    rxChars = [];

    for (const service of services) {
      log(`Service: ${service.uuid}`, "sys");
      try {
        const characteristics = await service.getCharacteristics();
        for (const c of characteristics) {
          const props = [];
          if (c.properties.write) props.push('WRITE');
          if (c.properties.writeWithoutResponse) props.push('WRITE_NO_RESP');
          if (c.properties.notify) props.push('NOTIFY');
          if (c.properties.indicate) props.push('INDICATE');
          if (c.properties.read) props.push('READ');

          log(` -> Char: ${c.uuid} [${props.join(', ')}]`, "sys");

          if ((c.properties.write || c.properties.writeWithoutResponse) && !txChar) {
            txChar = c;
            log(`    [+] Als TX (Sende-Kanal) ausgewählt`, "tx");
          }

          if (c.properties.notify || c.properties.indicate) {
            try {
              await c.startNotifications();
              c.addEventListener('characteristicvaluechanged', handleRX);
              rxChars.push(c);
              log(`    [+] RX (Listen-Kanal) aktiv`, "rx");
            } catch (e) {
              log(`    [-] Notify Fehler: ${e.message}`, "err");
            }
          }
        }
      } catch (e) {
        log(`Fehler beim Abrufen der Characteristics: ${e.message}`, "err");
      }
    }

    if (!txChar) {
      log("WARNUNG: Keinen schreibbaren TX-Kanal gefunden!", "err");
    }

    connectUI();

  } catch (err) {
    log(`Verbindungsfehler: ${err.message}`, "err");
    disconnectUI();
  }
};

function handleRX(event) {
  const buf = new Uint8Array(event.target.value.buffer);
  const hex = Array.from(buf).map(b => b.toString(16).padStart(2, '0').toUpperCase()).join(' ');
  log(`RX <- ${hex}`, "rx");
}

btnSend.onclick = () => sendHex(hexInput.value);
hexInput.onkeydown = (e) => { if (e.key === 'Enter') sendHex(hexInput.value); };

async function sendHex(hexString) {
  if (!txChar) {
    log("Fehler: Kein TX-Schreibkanal vorhanden.", "err");
    return;
  }

  const rawInput = hexString.replace(/[^0-9a-fA-F]/g, '');
  if (rawInput.length === 0 || rawInput.length % 2 !== 0) {
    log("Ungültiger Hex-Code! Bitte zweistellige Hex-Werte eingeben.", "err");
    return;
  }

  const bytes = new Uint8Array(rawInput.match(/.{1,2}/g).map(b => parseInt(b, 16)));
  const hexFormatted = Array.from(bytes).map(b => b.toString(16).padStart(2, '0').toUpperCase()).join(' ');

  try {
    log(`TX -> ${hexFormatted}`, "tx");
    if (txChar.properties.writeWithoutResponse) {
      await txChar.writeValueWithoutResponse(bytes);
    } else {
      await txChar.writeValue(bytes);
    }
  } catch (err) {
    log(`Schreibfehler: ${err.message}`, "err");
  }
}

function setButtonsDisabled(disabled) {
  actionButtons.forEach(b => {
    const el = document.getElementById(b.id);
    if (el) el.disabled = disabled;
  });
  btnSend.disabled = disabled;
  hexInput.disabled = disabled;
}

function connectUI() {
  statusEl.textContent = "Verbunden";
  statusEl.setAttribute('data-state', 'connected');
  btnConn.textContent = "Trennen";
  btnConn.classList.add('danger');
  setButtonsDisabled(false);
}

function disconnectUI() {
  statusEl.textContent = "Getrennt";
  statusEl.setAttribute('data-state', 'disconnected');
  btnConn.textContent = "Gerät suchen & verbinden";
  btnConn.classList.remove('danger');
  setButtonsDisabled(true);
  devInfo.textContent = "Kein Gerät ausgewählt";
  log("Verbindung getrennt.", "sys");
}
</script>
</body>
</html>
