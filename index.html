<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NAVEE Scooter Controller</title>
<style>
  :root {
    --bg-color: #0d0f12;
    --card-bg: #161b22;
    --border-color: #30363d;
    --text-color: #c9d1d9;
    --heading-color: #f0f6fc;
    --accent-color: #238636;
    --accent-hover: #2ea043;
    --warn-color: #da3633;
    --btn-neutral: #21262d;
    --btn-neutral-hover: #30363d;
  }
  [data-theme="light"] {
    --bg-color: #f6f8fa;
    --card-bg: #ffffff;
    --border-color: #d0d7de;
    --text-color: #1f2328;
    --heading-color: #0f1419;
    --accent-color: #1f883d;
    --accent-hover: #1a7f37;
    --warn-color: #cf222e;
    --btn-neutral: #f3f4f6;
    --btn-neutral-hover: #e5e7eb;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    background-color: var(--bg-color);
    color: var(--text-color);
    margin: 0;
    padding: 16px;
  }
  .wrap { max-width: 700px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  h1 { font-size: 1.2rem; margin: 0; color: var(--heading-color); }
  .status {
    font-size: 0.8rem; padding: 4px 10px; border-radius: 20px;
    background: #333; color: #fff; font-weight: bold;
  }
  .status[data-state="connected"] { background: #238636; }
  .status[data-state="connecting"] { background: #d29922; }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 14px;
  }
  .section-title {
    font-size: 0.85rem;
    font-weight: bold;
    margin-bottom: 8px;
    color: var(--heading-color);
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 4px;
  }
  .row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 8px; }
  .grid-6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 8px; }

  input[type="text"] {
    flex: 1; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color);
    background: var(--bg-color); color: #39ff14; font-family: monospace; font-size: 0.9rem; outline: none;
  }
  
  .checkbox-label {
    font-size: 0.8rem;
    color: var(--text-color);
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    user-select: none;
  }

  /* Base Button Design */
  button {
    padding: 10px 8px; border-radius: 6px; border: 1px solid var(--border-color); font-weight: bold;
    cursor: pointer; background: var(--btn-neutral); color: var(--text-color); transition: all 0.2s ease;
    font-size: 0.85rem; text-align: center;
  }
  button:hover:not(:disabled) { background: var(--btn-neutral-hover); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Main Connection Button */
  #btn-conn {
    background: var(--accent-color);
    color: white;
    border: none;
  }
  #btn-conn:hover:not(:disabled) { background: var(--accent-hover); }

  /* Dynamic Active States */
  button.active-success { background: #238636 !important; color: white !important; border-color: #2ea043 !important; }
  button.active-primary { background: #1f6feb !important; color: white !important; border-color: #388bfd !important; }
  button.active-danger { background: var(--warn-color) !important; color: white !important; border-color: #f85149 !important; }
  button.active-secondary { background: #8957e5 !important; color: white !important; border-color: #a371f7 !important; }
  button.active-neutral { background: #30363d !important; color: white !important; border-color: #8b949e !important; }
  
  pre#console {
    background: #000; color: #39ff14; padding: 12px; border-radius: 6px;
    font-size: 0.8rem; height: 280px; overflow-y: auto; white-space: pre-wrap;
    font-family: monospace; border: 1px solid var(--border-color); margin: 0;
  }
  .rx-text { color: #00ffff; }
  .tx-text { color: #ff00ff; }
  .sys-text { color: #8b949e; }
  .err-text { color: #ff4d4d; }

  footer {
    text-align: center;
    font-size: 0.8rem;
    color: var(--border-color);
    margin-top: 20px;
    margin-bottom: 10px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>NAVEE Scooter Controller</h1>
    <span class="status" id="status" data-state="disconnected">Disconnected</span>
  </header>

  <!-- CONNECTION -->
  <div class="card">
    <div class="row" style="margin-bottom:0;">
      <button id="btn-conn" style="width: 100%;">Search & Connect Scooter</button>
    </div>
    <div class="row" style="margin-top: 8px; margin-bottom:0;">
      <label class="checkbox-label">
        <input type="checkbox" id="chk-all-devices">
        Show all Bluetooth devices (ignore "NAVEE" filter)
      </label>
    </div>
    <div class="row" style="margin-top: 6px; margin-bottom:0;">
      <span class="sys-text" id="dev-info">No device selected</span>
    </div>
  </div>

  <!-- CONTROLS -->
  <div class="card">
    <!-- Lock / Unlock -->
    <div class="section-title">Lock / Unlock</div>
    <div class="grid-2">
      <button id="btn-unlock" disabled>🔓 Unlock</button>
      <button id="btn-lock" disabled>🔒 Lock</button>
    </div>

    <!-- KERS -->
    <div class="section-title" style="margin-top: 10px;">KERS (Regen Braking)</div>
    <div class="grid-4">
      <button id="btn-kers-off" disabled>Off</button>
      <button id="btn-kers-low" disabled>Low</button>
      <button id="btn-kers-mid" disabled>Mid</button>
      <button id="btn-kers-high" disabled>High</button>
    </div>

    <!-- TCS, Cruise Control & Eco Turbo -->
    <div class="section-title" style="margin-top: 10px;">Driving Features</div>
    <div class="grid-2">
      <button id="btn-tcs-on" disabled>TCS On</button>
      <button id="btn-tcs-off" disabled>TCS Off</button>
    </div>
    <div class="grid-2">
      <button id="btn-cruise-on" disabled>Cruise Control On</button>
      <button id="btn-cruise-off" disabled>Cruise Control Off</button>
    </div>
    <div class="grid-2">
      <button id="btn-turbo-on" disabled>Eco Turbo On</button>
      <button id="btn-turbo-off" disabled>Eco Turbo Off</button>
    </div>

    <!-- Start Speed -->
    <div class="section-title" style="margin-top: 10px;">Start Speed (Kickstart)</div>
    <div class="grid-6">
      <button id="btn-speed-0" disabled>0 km/h</button>
      <button id="btn-speed-1" disabled>1</button>
      <button id="btn-speed-2" disabled>2</button>
      <button id="btn-speed-3" disabled>3</button>
      <button id="btn-speed-4" disabled>4</button>
      <button id="btn-speed-5" disabled>5 km/h</button>
    </div>

    <!-- Lights & Sound -->
    <div class="section-title" style="margin-top: 10px;">Lights & Audio</div>
    <div class="grid-2">
      <button id="btn-light-on" disabled>💡 Rear Light On</button>
      <button id="btn-light-off" disabled>💡 Rear Light Off</button>
    </div>
    <div class="grid-2">
      <button id="btn-autolight-on" disabled>🅰️ Auto Light On</button>
      <button id="btn-autolight-off" disabled>🅰️ Auto Light Off</button>
    </div>
    <div class="grid-2">
      <button id="btn-sound-on" disabled>🔊 Indicator Sound On</button>
      <button id="btn-sound-off" disabled>🔇 Indicator Sound Off</button>
    </div>
  </div>

  <!-- MANUAL HEX TERMINAL -->
  <div class="card">
    <div class="section-title">Manual Hex Terminal</div>
    <div class="row">
      <input type="text" id="hex-input" placeholder="Enter Hex (e.g., 55 AA 00...)" disabled>
      <button id="btn-send" disabled>Send</button>
    </div>
  </div>

  <!-- TERMINAL LOG -->
  <div class="card" style="padding: 8px;">
    <div class="row" style="justify-content: space-between; padding: 0 4px 6px 4px;">
      <span style="font-size: 0.85rem; font-weight: bold;">Live Log</span>
      <button id="btn-clear" style="padding: 4px 8px; font-size: 0.75rem;">Clear</button>
    </div>
    <pre id="console">[SYS] Ready. Click 'Search & Connect Scooter'...</pre>
  </div>

  <footer>by Max</footer>
</div>

<script>
let gattServer = null;
let txChar = null;
let rxChars = [];

const btnConn = document.getElementById('btn-conn');
const btnSend = document.getElementById('btn-send');
const btnClear = document.getElementById('btn-clear');
const hexInput = document.getElementById('hex-input');
const statusEl = document.getElementById('status');
const devInfo = document.getElementById('dev-info');
const consoleEl = document.getElementById('console');
const chkAllDevices = document.getElementById('chk-all-devices');

// Hex Commands
const COMMANDS = {
  unlock:      "55 AA 00 51 01 00 51 FE FD",
  lock:        "55 AA 00 51 01 01 52 FE FD",
  kersOff:     "55 AA 00 53 01 00 53 FE FD",
  kersLow:     "55 AA 00 53 01 1E 71 FE FD",
  kersMid:     "55 AA 00 53 01 3C 8F FE FD",
  kersHigh:    "55 AA 00 53 01 5A AD FE FD",
  tcsOn:       "55 AA 00 5F 01 01 60 FE FD",
  tcsOff:      "55 AA 00 5F 01 00 5F FE FD",
  cruiseOn:    "55 AA 00 52 01 01 53 FE FD",
  cruiseOff:   "55 AA 00 52 01 00 52 FE FD",
  speed5:      "55 AA 00 6A 01 05 6F FE FD",
  speed4:      "55 AA 00 6A 01 04 6E FE FD",
  speed3:      "55 AA 00 6A 01 03 6D FE FD",
  speed2:      "55 AA 00 6A 01 02 6C FE FD",
  speed1:      "55 AA 00 6A 01 01 6B FE FD",
  speed0:      "55 AA 00 6A 01 00 6A FE FD",
  turboOn:     "55 AA 00 58 01 05 5D FE FD",
  turboOff:    "55 AA 00 58 01 03 5B FE FD",
  lightOn:     "55 AA 00 54 01 01 55 FE FD",
  lightOff:    "55 AA 00 54 01 00 54 FE FD",
  autoLightOn: "55 AA 00 57 01 01 58 FE FD",
  autoLightOff:"55 AA 00 57 01 00 57 FE FD",
  soundOn:     "55 AA 00 60 01 01 61 FE FD",
  soundOff:    "55 AA 00 60 01 00 60 FE FD"
};

// Button assignments & active color states
const actionButtons = [
  { id: 'btn-unlock', hex: COMMANDS.unlock, colorClass: 'active-success', group: 'lock' },
  { id: 'btn-lock', hex: COMMANDS.lock, colorClass: 'active-danger', group: 'lock' },

  { id: 'btn-kers-off', hex: COMMANDS.kersOff, colorClass: 'active-neutral', group: 'kers' },
  { id: 'btn-kers-low', hex: COMMANDS.kersLow, colorClass: 'active-secondary', group: 'kers' },
  { id: 'btn-kers-mid', hex: COMMANDS.kersMid, colorClass: 'active-secondary', group: 'kers' },
  { id: 'btn-kers-high', hex: COMMANDS.kersHigh, colorClass: 'active-secondary', group: 'kers' },

  { id: 'btn-tcs-on', hex: COMMANDS.tcsOn, colorClass: 'active-primary', group: 'tcs' },
  { id: 'btn-tcs-off', hex: COMMANDS.tcsOff, colorClass: 'active-neutral', group: 'tcs' },

  { id: 'btn-cruise-on', hex: COMMANDS.cruiseOn, colorClass: 'active-primary', group: 'cruise' },
  { id: 'btn-cruise-off', hex: COMMANDS.cruiseOff, colorClass: 'active-neutral', group: 'cruise' },

  { id: 'btn-turbo-on', hex: COMMANDS.turboOn, colorClass: 'active-secondary', group: 'turbo' },
  { id: 'btn-turbo-off', hex: COMMANDS.turboOff, colorClass: 'active-neutral', group: 'turbo' },

  { id: 'btn-speed-0', hex: COMMANDS.speed0, colorClass: 'active-primary', group: 'speed' },
  { id: 'btn-speed-1', hex: COMMANDS.speed1, colorClass: 'active-primary', group: 'speed' },
  { id: 'btn-speed-2', hex: COMMANDS.speed2, colorClass: 'active-primary', group: 'speed' },
  { id: 'btn-speed-3', hex: COMMANDS.speed3, colorClass: 'active-primary', group: 'speed' },
  { id: 'btn-speed-4', hex: COMMANDS.speed4, colorClass: 'active-primary', group: 'speed' },
  { id: 'btn-speed-5', hex: COMMANDS.speed5, colorClass: 'active-primary', group: 'speed' },

  { id: 'btn-light-on', hex: COMMANDS.lightOn, colorClass: 'active-primary', group: 'light' },
  { id: 'btn-light-off', hex: COMMANDS.lightOff, colorClass: 'active-neutral', group: 'light' },

  { id: 'btn-autolight-on', hex: COMMANDS.autoLightOn, colorClass: 'active-primary', group: 'autolight' },
  { id: 'btn-autolight-off', hex: COMMANDS.autoLightOff, colorClass: 'active-neutral', group: 'autolight' },

  { id: 'btn-sound-on', hex: COMMANDS.soundOn, colorClass: 'active-primary', group: 'sound' },
  { id: 'btn-sound-off', hex: COMMANDS.soundOff, colorClass: 'active-neutral', group: 'sound' }
];

actionButtons.forEach(b => {
  const el = document.getElementById(b.id);
  if (el) {
    el.onclick = () => {
      actionButtons.filter(item => item.group === b.group).forEach(item => {
        const itemEl = document.getElementById(item.id);
        if (itemEl) itemEl.className = '';
      });
      el.classList.add(b.colorClass);
      sendHex(b.hex);
    };
  }
});

function log(msg, type = 'sys') {
  const time = new Date().toLocaleTimeString();
  const span = document.createElement('span');
  span.className = `${type}-text`;
  span.textContent = `\n[${time}] ${msg}`;
  consoleEl.appendChild(span);
  consoleEl.scrollTop = consoleEl.scrollHeight;
}

btnClear.onclick = () => { consoleEl.textContent = '[SYS] Log cleared.'; };

btnConn.onclick = async () => {
  if (gattServer && gattServer.connected) {
    gattServer.disconnect();
    disconnectUI();
    return;
  }

  if (!navigator.bluetooth) {
    alert("Web Bluetooth is not supported. Please use Bluefy (iOS) or Chrome (Android/PC)!");
    return;
  }

  try {
    const showAll = chkAllDevices.checked;
    log(`Scanning for Bluetooth LE devices (${showAll ? 'All devices' : 'NAVEE filter active'})...`, "sys");
    statusEl.textContent = "Scanning...";
    statusEl.setAttribute('data-state', 'connecting');

    const requestOptions = {
      optionalServices: [
        '0000fe01-0000-1000-8000-00805f9b34fb',
        '0000e0ff-0000-1000-8000-00805f9b34fb',
        '00001800-0000-1000-8000-00805f9b34fb',
        '0000180a-0000-1000-8000-00805f9b34fb'
      ]
    };

    if (showAll) {
      requestOptions.acceptAllDevices = true;
    } else {
      requestOptions.filters = [{ namePrefix: 'NAVEE' }];
    }

    const device = await navigator.bluetooth.requestDevice(requestOptions);

    devInfo.textContent = `Device: ${device.name || 'Unnamed'} (${device.id})`;
    log(`Connecting to: ${device.name || 'Unnamed'}...`, "sys");

    gattServer = await device.gatt.connect();
    log("GATT Server connected! Fetching services...", "sys");

    const services = await gattServer.getPrimaryServices();
    log(`Found ${services.length} services.`, "sys");

    txChar = null;
    rxChars = [];

    for (const service of services) {
      log(`Service: ${service.uuid}`, "sys");
      try {
        const characteristics = await service.getCharacteristics();
        for (const c of characteristics) {
          const props = [];
          if (c.properties.write) props.push('WRITE');
          if (c.properties.writeWithoutResponse) props.push('WRITE_NO_RESP');
          if (c.properties.notify) props.push('NOTIFY');
          if (c.properties.indicate) props.push('INDICATE');
          if (c.properties.read) props.push('READ');

          log(` -> Char: ${c.uuid} [${props.join(', ')}]`, "sys");

          if ((c.properties.write || c.properties.writeWithoutResponse) && !txChar) {
            txChar = c;
            log(`    [+] Selected as TX channel`, "tx");
          }

          if (c.properties.notify || c.properties.indicate) {
            try {
              await c.startNotifications();
              c.addEventListener('characteristicvaluechanged', handleRX);
              rxChars.push(c);
              log(`    [+] RX channel active`, "rx");
            } catch (e) {
              log(`    [-] Notify error: ${e.message}`, "err");
            }
          }
        }
      } catch (e) {
        log(`Error getting characteristics: ${e.message}`, "err");
      }
    }

    if (!txChar) {
      log("WARNING: No writable TX channel found!", "err");
    }

    connectUI();

  } catch (err) {
    log(`Connection error: ${err.message}`, "err");
    disconnectUI();
  }
};

function handleRX(event) {
  const buf = new Uint8Array(event.target.value.buffer);
  const hex = Array.from(buf).map(b => b.toString(16).padStart(2, '0').toUpperCase()).join(' ');
  log(`RX <- ${hex}`, "rx");
}

btnSend.onclick = () => sendHex(hexInput.value);
hexInput.onkeydown = (e) => { if (e.key === 'Enter') sendHex(hexInput.value); };

async function sendHex(hexString) {
  if (!txChar) {
    log("Error: No writable TX channel available.", "err");
    return;
  }

  const rawInput = hexString.replace(/[^0-9a-fA-F]/g, '');
  if (rawInput.length === 0 || rawInput.length % 2 !== 0) {
    log("Invalid Hex code! Please enter valid byte pairs.", "err");
    return;
  }

  const bytes = new Uint8Array(rawInput.match(/.{1,2}/g).map(b => parseInt(b, 16)));
  const hexFormatted = Array.from(bytes).map(b => b.toString(16).padStart(2, '0').toUpperCase()).join(' ');

  try {
    log(`TX -> ${hexFormatted}`, "tx");
    if (txChar.properties.writeWithoutResponse) {
      await txChar.writeValueWithoutResponse(bytes);
    } else {
      await txChar.writeValue(bytes);
    }
  } catch (err) {
    log(`Write error: ${err.message}`, "err");
  }
}

function resetAllButtonColors() {
  actionButtons.forEach(b => {
    const el = document.getElementById(b.id);
    if (el) el.className = '';
  });
}

function setButtonsDisabled(disabled) {
  actionButtons.forEach(b => {
    const el = document.getElementById(b.id);
    if (el) el.disabled = disabled;
  });
  btnSend.disabled = disabled;
  hexInput.disabled = disabled;
}

function connectUI() {
  statusEl.textContent = "Connected";
  statusEl.setAttribute('data-state', 'connected');
  btnConn.textContent = "Disconnect";
  btnConn.style.background = "var(--warn-color)";
  chkAllDevices.disabled = true;
  setButtonsDisabled(false);
}

function disconnectUI() {
  statusEl.textContent = "Disconnected";
  statusEl.setAttribute('data-state', 'disconnected');
  btnConn.textContent = "Search & Connect Scooter";
  btnConn.style.background = "var(--accent-color)";
  chkAllDevices.disabled = false;
  setButtonsDisabled(true);
  resetAllButtonColors();
  devInfo.textContent = "No device selected";
  log("Disconnected.", "sys");
}
</script>
</body>
</html>
