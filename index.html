<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bluetooth Terminal & Sniffer</title>
<style>
  :root {
    --bg-color: #0d0f12;
    --card-bg: #161b22;
    --border-color: #30363d;
    --text-color: #c9d1d9;
    --heading-color: #f0f6fc;
    --accent-color: #238636;
    --accent-hover: #2ea043;
    --warn-color: #da3633;
    --subtext: #8b949e;
  }
  [data-theme="light"] {
    --bg-color: #f6f8fa;
    --card-bg: #ffffff;
    --border-color: #d0d7de;
    --text-color: #1f2328;
    --heading-color: #0f1419;
    --accent-color: #1f883d;
    --accent-hover: #1a7f37;
    --warn-color: #cf222e;
    --subtext: #57606a;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    background-color: var(--bg-color);
    color: var(--text-color);
    margin: 0;
    padding: 16px;
  }
  .wrap { max-width: 700px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  h1 { font-size: 1.2rem; margin: 0; color: var(--heading-color); }
  .status {
    font-size: 0.8rem; padding: 4px 10px; border-radius: 20px;
    background: #333; color: #fff; font-weight: bold;
  }
  .status[data-state="connected"] { background: #238636; }
  .status[data-state="connecting"] { background: #d29922; }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 14px;
  }
  .row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
  input[type="text"] {
    flex: 1; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color);
    background: var(--bg-color); color: #39ff14; font-family: monospace; font-size: 0.9rem; outline: none;
  }
  button {
    padding: 10px 14px; border-radius: 6px; border: none; font-weight: bold;
    cursor: pointer; background: var(--accent-color); color: white; transition: background 0.2s;
  }
  button:hover:not(:disabled) { background: var(--accent-hover); }
  button.danger { background: var(--warn-color); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  
  pre#console {
    background: #000; color: #39ff14; padding: 12px; border-radius: 6px;
    font-size: 0.8rem; height: 350px; overflow-y: auto; white-space: pre-wrap;
    font-family: monospace; border: 1px solid var(--border-color); margin: 0;
  }
  .rx-text { color: #00ffff; }
  .tx-text { color: #ff00ff; }
  .sys-text { color: #8b949e; }
  .err-text { color: #ff4d4d; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>BLE Terminal & Sniffer</h1>
    <span class="status" id="status" data-state="disconnected">Getrennt</span>
  </header>

  <!-- VERBINDUNG -->
  <div class="card">
    <div class="row">
      <button id="btn-conn" style="width: 100%;">Gerät suchen & verbinden</button>
    </div>
    <div class="row">
      <span class="sys-text" id="dev-info">Kein Gerät ausgewählt</span>
    </div>
  </div>

  <!-- HEX SENDEN -->
  <div class="card">
    <div class="row">
      <input type="text" id="hex-input" placeholder="Hex eingeben (z.B. 55 AA 03 01 00 04)" disabled>
      <button id="btn-send" disabled>Senden</button>
    </div>
  </div>

  <!-- TERMINAL -->
  <div class="card" style="padding: 8px;">
    <div class="row" style="justify-content: space-between; padding: 0 4px 6px 4px;">
      <span style="font-size: 0.85rem; font-weight: bold;">Live Log</span>
      <button id="btn-clear" style="padding: 4px 8px; font-size: 0.75rem; background: #333;">Clear</button>
    </div>
    <pre id="console">[SYS] Bereit. Klicke auf 'Gerät suchen & verbinden'...</pre>
  </div>
</div>

<script>
let gattServer = null;
let txChar = null;
let rxChars = [];

const btnConn = document.getElementById('btn-conn');
const btnSend = document.getElementById('btn-send');
const btnClear = document.getElementById('btn-clear');
const hexInput = document.getElementById('hex-input');
const statusEl = document.getElementById('status');
const devInfo = document.getElementById('dev-info');
const consoleEl = document.getElementById('console');

function log(msg, type = 'sys') {
  const time = new Date().toLocaleTimeString();
  const span = document.createElement('span');
  span.className = `${type}-text`;
  span.textContent = `\n[${time}] ${msg}`;
  consoleEl.appendChild(span);
  consoleEl.scrollTop = consoleEl.scrollHeight;
}

btnClear.onclick = () => { consoleEl.textContent = '[SYS] Log geleert.'; };

btnConn.onclick = async () => {
  if (gattServer && gattServer.connected) {
    gattServer.disconnect();
    disconnectUI();
    return;
  }

  if (!navigator.bluetooth) {
    alert("Web Bluetooth wird nicht unterstützt. Bitte benutze Bluefy (iOS) oder Chrome (Android/PC)!");
    return;
  }

  try {
    log("Scanne nach allen Bluetooth LE Geräten...", "sys");
    statusEl.textContent = "Suche...";
    statusEl.setAttribute('data-state', 'connecting');

    // Scannet absolut jedes Bluetooth-Gerät ohne Filter
    const device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: [
        '0000fe01-0000-1000-8000-00805f9b34fb',
        '0000e0ff-0000-1000-8000-00805f9b34fb',
        '00001800-0000-1000-8000-00805f9b34fb',
        '0000180a-0000-1000-8000-00805f9b34fb'
      ]
    });

    devInfo.textContent = `Gerät: ${device.name || 'Unbenannt'} (${device.id})`;
    log(`Verbinde mit: ${device.name || 'Unbenannt'}...`, "sys");

    gattServer = await device.gatt.connect();
    log("GATT Server verbunden! Rufe Primary Services ab...", "sys");

    const services = await gattServer.getPrimaryServices();
    log(`Anzahl gefundener Services: ${services.length}`, "sys");

    txChar = null;
    rxChars = [];

    for (const service of services) {
      log(`Service: ${service.uuid}`, "sys");
      try {
        const characteristics = await service.getCharacteristics();
        for (const c of characteristics) {
          const props = [];
          if (c.properties.write) props.push('WRITE');
          if (c.properties.writeWithoutResponse) props.push('WRITE_NO_RESP');
          if (c.properties.notify) props.push('NOTIFY');
          if (c.properties.indicate) props.push('INDICATE');
          if (c.properties.read) props.push('READ');

          log(` -> Char: ${c.uuid} [${props.join(', ')}]`, "sys");

          // Schreibkanal zuweisen
          if ((c.properties.write || c.properties.writeWithoutResponse) && !txChar) {
            txChar = c;
            log(`    [+] Als TX (Sende-Kanal) ausgewählt`, "tx");
          }

          // Lese/Notify-Kanäle aktivieren
          if (c.properties.notify || c.properties.indicate) {
            try {
              await c.startNotifications();
              c.addEventListener('characteristicvaluechanged', handleRX);
              rxChars.push(c);
              log(`    [+] RX (Listen-Kanal) aktiv`, "rx");
            } catch (e) {
              log(`    [-] Notify Fehler: ${e.message}`, "err");
            }
          }
        }
      } catch (e) {
        log(`Fehler beim Abrufen der Characteristics: ${e.message}`, "err");
      }
    }

    if (!txChar) {
      log("WARNUNG: Keinen schreibbaren TX-Kanal gefunden!", "err");
    }

    connectUI();

  } catch (err) {
    log(`Verbindungsfehler: ${err.message}`, "err");
    disconnectUI();
  }
};

function handleRX(event) {
  const buf = new Uint8Array(event.target.value.buffer);
  const hex = Array.from(buf).map(b => b.toString(16).padStart(2, '0').toUpperCase()).join(' ');
  log(`RX <- ${hex}`, "rx");
}

btnSend.onclick = sendHex;
hexInput.onkeydown = (e) => { if (e.key === 'Enter') sendHex(); };

async function sendHex() {
  if (!txChar) {
    log("Fehler: Kein TX-Schreibkanal vorhanden.", "err");
    return;
  }

  const rawInput = hexInput.value.replace(/[^0-9a-fA-F]/g, '');
  if (rawInput.length === 0 || rawInput.length % 2 !== 0) {
    log("Ungültiger Hex-Code! Bitte zweistellige Hex-Werte eingeben (z. B. 55 AA 01).", "err");
    return;
  }

  const bytes = new Uint8Array(rawInput.match(/.{1,2}/g).map(b => parseInt(b, 16)));
  const hexFormatted = Array.from(bytes).map(b => b.toString(16).padStart(2, '0').toUpperCase()).join(' ');

  try {
    log(`TX -> ${hexFormatted}`, "tx");
    if (txChar.properties.writeWithoutResponse) {
      await txChar.writeValueWithoutResponse(bytes);
    } else {
      await txChar.writeValue(bytes);
    }
  } catch (err) {
    log(`Schreibfehler: ${err.message}`, "err");
  }
}

function connectUI() {
  statusEl.textContent = "Verbunden";
  statusEl.setAttribute('data-state', 'connected');
  btnConn.textContent = "Trennen";
  btnConn.classList.add('danger');
  btnSend.disabled = false;
  hexInput.disabled = false;
}

function disconnectUI() {
  statusEl.textContent = "Getrennt";
  statusEl.setAttribute('data-state', 'disconnected');
  btnConn.textContent = "Gerät suchen & verbinden";
  btnConn.classList.remove('danger');
  btnSend.disabled = true;
  hexInput.disabled = true;
  devInfo.textContent = "Kein Gerät ausgewählt";
  log("Verbindung getrennt.", "sys");
}
</script>
</body>
</html>
